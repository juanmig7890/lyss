# docker compose up -d   ->   http://127.0.0.1:8765 (first start asks for the admin password)
services:
  lyss:
    build: .
    image: lyss:0.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"     # local only; use an HTTPS reverse proxy for remote access
    volumes:
      - lyss-data:/data
      # SSH key for the jump host, if you use one (path to enter in Settings > Jump host):
      # - ./keys/jump_ed25519:/run/secrets/jump_key:ro
    # environment:
    #   LYSS_MASTER_KEY: "<base64 of 32 random bytes>"   # instead of /data/master.key
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  lyss-data:
