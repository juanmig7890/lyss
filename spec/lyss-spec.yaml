# LYSS Specification: vendor-neutral security controls for network switches.
# This file is the normative source: docs/LYSS-Specification.md is generated from it
# (python tools/build_spec.py). It says WHAT must be true; HOW to check it on each platform
# lives in adapters/. Licensed CC BY 4.0 (see LICENSE-SPEC).
spec_version: "0.4.0-draft"
status: draft
levels:
  1: Baseline
  2: Hardened
  3: Advanced

domains:
  MGMT: Management plane access
  AUTH: Authentication and credentials
  LOG: Logging and time
  VULN: Firmware and vulnerabilities
  BKP: Configuration resilience
  ACC: Access-layer protection

controls:

  # ---------------- Level 1: Baseline ----------------

  - id: LYSS-MGMT-001
    level: 1
    title: Telnet management access is disabled
    statement: The switch does not accept management sessions over Telnet.
    rationale: Telnet sends credentials and session data in cleartext; anyone on the path can capture administrator passwords.
    test_procedure: >-
      Check that no management service listens on TCP 23 (device state) and that no remote CLI
      line or service is configured to accept Telnet (configuration). Fail if either shows Telnet
      accepted. Unknown if the platform hides the Telnet default and no device state is available.
    evidence: [config, state]
    mappings:
      iso27001_2022: [A.8.20, A.8.21, A.8.24]
      nist_800_53r5: [CM-7, SC-8, AC-17(2)]
      cis_v8: ["4.8", "12.6"]

  - id: LYSS-MGMT-002
    level: 1
    title: SSH management uses protocol version 2 only
    statement: SSH is the remote CLI protocol and SSH protocol version 1 is not accepted.
    rationale: SSHv1 has known cryptographic weaknesses and must not be negotiable.
    test_procedure: >-
      Read the SSH identification string of the switch: "SSH-2.0-" passes, "SSH-1.99-" or
      "SSH-1.5-" fails. Without device state, an explicit "version 2 only" setting passes.
    evidence: [config, state]
    mappings:
      iso27001_2022: [A.8.21, A.8.24]
      nist_800_53r5: [SC-8, SC-13, AC-17(2)]
      cis_v8: ["12.6"]

  - id: LYSS-MGMT-003
    level: 1
    title: Cleartext HTTP management is disabled
    statement: The web management interface, if enabled, is only reachable over HTTPS.
    rationale: Plain HTTP exposes administrator credentials and session cookies.
    test_procedure: >-
      Fail if a management web service listens on TCP 80 (device state) or the plain HTTP server
      is enabled in the configuration, including when it is enabled by default and not disabled.
    evidence: [config, state]
    mappings:
      iso27001_2022: [A.8.21, A.8.24]
      nist_800_53r5: [CM-7, SC-8, AC-17(2)]
      cis_v8: ["4.8", "12.6"]

  - id: LYSS-MGMT-004
    level: 1
    title: Idle management sessions time out within 10 minutes
    statement: Interactive CLI sessions (console and remote) are closed after at most 10 minutes of inactivity.
    rationale: Abandoned privileged sessions can be reused by anyone with access to the terminal or session.
    test_procedure: >-
      Fail if any console or remote CLI line has no timeout (0) or a timeout above the parameter.
      The platform default applies when no timeout is configured.
    evidence: [config]
    parameters: {max_idle_minutes: 10}
    mappings:
      iso27001_2022: [A.8.5]
      nist_800_53r5: [AC-12, SC-10]
      cis_v8: ["4.3"]

  - id: LYSS-AUTH-001
    level: 1
    title: No default or well-known SNMP community strings
    statement: SNMP communities "public", "private" and vendor defaults are not configured.
    rationale: Default communities give anyone on the network read (or write) access to the device.
    test_procedure: Fail if an SNMP community named "public", "private" or a documented vendor default is configured.
    evidence: [config]
    mappings:
      iso27001_2022: [A.5.17, A.8.21]
      nist_800_53r5: [IA-5, CM-6]
      cis_v8: ["4.7"]

  - id: LYSS-AUTH-002
    level: 1
    title: Privileged-mode password is stored as a strong hash
    statement: The privileged (enable) credential is stored with a one-way hash, not in cleartext or a reversible encoding.
    rationale: Reversible encodings (e.g. Cisco type 7) are decoded instantly by public tools from any configuration backup.
    test_procedure: >-
      Fail if the privileged credential is stored in cleartext or a reversible form. Pass if it is
      hashed, or if there is no privileged credential and privileged access is only granted to
      local accounts whose credentials are hashed or through central AAA.
    evidence: [config]
    mappings:
      iso27001_2022: [A.5.17, A.8.5]
      nist_800_53r5: [IA-5(1)]
      cis_v8: ["3.11"]

  - id: LYSS-AUTH-003
    level: 1
    title: Local account passwords are not stored in cleartext or reversible form
    statement: Every local user account credential is stored as a one-way hash.
    rationale: Configuration backups circulate (backup servers, tickets, e-mail); stored passwords must not be recoverable.
    test_procedure: Fail if any local account credential is stored in cleartext or a reversible encoding.
    evidence: [config]
    mappings:
      iso27001_2022: [A.5.17]
      nist_800_53r5: [IA-5(1)]
      cis_v8: ["3.11"]

  - id: LYSS-AUTH-004
    level: 1
    title: AAA shared secrets (RADIUS/TACACS+) are not stored in cleartext
    statement: Keys shared with RADIUS or TACACS+ servers are never stored in cleartext in the configuration.
    rationale: A cleartext RADIUS key in a backup lets an attacker impersonate the AAA server or decrypt authentication traffic.
    test_procedure: Fail if a RADIUS or TACACS+ shared key appears in cleartext. Reversible encodings pass Level 1 only.
    evidence: [config]
    mappings:
      iso27001_2022: [A.5.17, A.8.24]
      nist_800_53r5: [IA-5, SC-28]
      cis_v8: ["3.11"]

  - id: LYSS-VULN-001
    level: 1
    title: Firmware is vendor-supported and free of known critical vulnerabilities
    statement: >-
      The vendor still publishes security fixes for the device, and the running firmware has no known
      critical (CVSS >= 9.0) or known-exploited (CISA KEV) vulnerability whose fix is not installed.
    rationale: Unsupported or vulnerable firmware is the most common path to switch compromise.
    test_procedure: >-
      Identify the model and firmware version from device state and compare them with a sourced
      knowledge base (vendor advisories, end-of-life bulletins, CISA KEV). Fail if security support
      has ended or an applicable advisory is unfixed in the running version. Unknown if the platform
      is not in the knowledge base: a pass is never assumed.
    evidence: [state, external_data]
    mappings:
      iso27001_2022: [A.8.8]
      nist_800_53r5: [SI-2, SA-22, RA-5]
      cis_v8: ["2.2", "12.1"]

  - id: LYSS-BKP-001
    level: 1
    title: Configuration is backed up automatically
    statement: A copy of the running configuration is collected automatically at least every 7 days.
    rationale: Without a recent backup, recovery after failure or compromise is slow and error-prone.
    test_procedure: >-
      Pass if an automatic (scheduled) collection of the running configuration is at most the
      parameter old, or if an administrator attested an external backup system for the device
      within the last 90 days. Fail if the last automatic backup is older, or only manual
      collections exist.
    evidence: [backup_system]
    parameters: {max_age_days: 7}
    mappings:
      iso27001_2022: [A.8.9, A.8.13]
      nist_800_53r5: [CP-9, CM-2(3)]
      cis_v8: ["11.2"]

  # ---------------- Level 2: Hardened ----------------

  - id: LYSS-AUTH-010
    level: 2
    title: Administrative logins use central AAA (RADIUS/TACACS+) with local fallback only
    statement: Administrator logins are authenticated by a RADIUS or TACACS+ server first; local accounts are only a fallback.
    rationale: Central AAA gives individual accounts, immediate revocation and an audit trail; shared local passwords do not.
    test_procedure: Pass if an AAA server is defined and the login method list tries it before local accounts.
    evidence: [config]
    mappings:
      iso27001_2022: [A.5.16, A.8.5]
      nist_800_53r5: [IA-2, AC-2]
      cis_v8: ["12.5"]

  - id: LYSS-AUTH-011
    level: 2
    title: SNMP uses v3 with authentication and privacy or is disabled
    statement: No SNMPv1/v2c community is configured; SNMP, if used, is SNMPv3 with authentication and encryption.
    rationale: SNMPv1/v2c communities travel in cleartext and are equivalent to shared passwords.
    test_procedure: Fail if any SNMPv1/v2c community or v1/v2 group is configured.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.21, A.8.24]
      nist_800_53r5: [SC-8, SC-13, IA-5]
      cis_v8: ["12.6"]

  - id: LYSS-MGMT-010
    level: 2
    title: Management access is restricted to authorized source networks
    statement: Management protocols only accept connections from authorized administration networks.
    rationale: Limiting who can even reach the login prompt removes most password-guessing and exploit attempts.
    test_procedure: Pass if every remote management access path is bound to an access list of authorized sources.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.20, A.8.22]
      nist_800_53r5: [AC-17, SC-7]
      cis_v8: ["12.3"]

  - id: LYSS-MGMT-011
    level: 2
    title: Management interface is on a dedicated management VLAN
    statement: The switch management address is not on the default VLAN (1) shared with user traffic.
    rationale: Separating management from user networks prevents users from reaching the management plane.
    test_procedure: Fail if VLAN 1 carries a management address. Pass if the management address is on another VLAN.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.22]
      nist_800_53r5: [SC-7, AC-4]
      cis_v8: ["12.2"]

  - id: LYSS-MGMT-012
    level: 2
    title: A legal warning banner is shown before login
    statement: A banner stating authorized use only is displayed before authentication.
    rationale: The warning supports legal action against intruders and informs users that activity is monitored.
    test_procedure: Pass if a login or message-of-the-day banner is configured.
    evidence: [config]
    mappings:
      iso27001_2022: [A.5.10]
      nist_800_53r5: [AC-8]
      cis_v8: []

  - id: LYSS-MGMT-013
    level: 2
    title: SSH uses modern key exchange, ciphers and host keys
    statement: The SSH server supports a SHA-2 (or better) key exchange, a CTR/GCM/ChaCha20 cipher and a SHA-2 host key signature.
    rationale: SHA-1 key exchange, CBC ciphers and ssh-rsa (SHA-1) signatures are deprecated; modern clients refuse them and they weaken the management channel.
    test_procedure: >-
      Connect offering the strongest algorithms first and record the negotiated ones (the best the
      switch supports). Fail on a SHA-1 or group1 key exchange, a CBC/3DES/RC4 cipher, or an
      ssh-rsa/ssh-dss host key signature.
    evidence: [state]
    mappings:
      iso27001_2022: [A.8.24, A.8.21]
      nist_800_53r5: [SC-8, SC-13]
      cis_v8: ["3.10", "12.6"]

  - id: LYSS-LOG-010
    level: 2
    title: Events are sent to a remote syslog/SIEM server
    statement: The switch forwards its logs to at least one remote syslog or SIEM collector.
    rationale: Local logs are lost on reboot and can be erased by an intruder; remote logs support detection and investigation.
    test_procedure: Pass if at least one remote syslog destination is configured.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.15, A.8.16]
      nist_800_53r5: [AU-4(1), AU-6]
      cis_v8: ["8.2", "8.9"]

  - id: LYSS-LOG-011
    level: 2
    title: Clock is synchronized with NTP/SNTP
    statement: The switch clock is synchronized with at least one configured time server.
    rationale: Without a reliable clock, logs cannot be correlated and certificates and schedules misbehave.
    test_procedure: Pass if at least one NTP or SNTP server is configured.
    evidence: [config]
    mappings:
      iso27001_2022: [A.8.17]
      nist_800_53r5: [AU-8, SC-45]
      cis_v8: ["8.4"]

  - id: LYSS-ACC-010
    level: 2
    title: Unused ports are administratively disabled
    statement: Ports with no link are administratively shut down.
    rationale: An enabled, unused port lets anyone plug in an unauthorized device.
    test_procedure: Fail if any port is operationally down while administratively enabled (device state).
    evidence: [config, state]
    mappings:
      iso27001_2022: [A.8.20]
      nist_800_53r5: [CM-7]
      cis_v8: ["12.3"]

  - id: LYSS-ACC-011
    level: 2
    title: Edge ports are protected against rogue spanning-tree participants (BPDU guard)
    statement: Every edge port (not connected to another switch) disables itself when it receives a spanning-tree BPDU.
    rationale: A rogue or misconnected switch on an access port can take over the spanning tree or create a loop.
    test_procedure: >-
      Edge ports are all ports minus uplinks (trunk / aggregation members in the configuration, and
      ports where neighbour discovery sees a bridge). Fail if an edge port lacks BPDU protection,
      unless a global default protects all edge ports.
    evidence: [config, state]
    mappings:
      iso27001_2022: [A.8.20]
      nist_800_53r5: [SC-5, CM-6]
      cis_v8: ["12.2"]

  # ---------------- Level 3: Advanced (draft: checks not written yet) ----------------

  - {id: LYSS-ACC-020, level: 3, title: DHCP snooping is enabled on user VLANs, evidence: [config], mappings: {iso27001_2022: [A.8.20]}}
  - {id: LYSS-ACC-021, level: 3, title: Dynamic ARP inspection is enabled on user VLANs, evidence: [config], mappings: {iso27001_2022: [A.8.20]}}
  - {id: LYSS-ACC-022, level: 3, title: Access ports require 802.1X or MAC authentication, evidence: [config], mappings: {iso27001_2022: [A.8.20, A.5.15], cis_v8: ["13.9"]}}
  - {id: LYSS-ACC-023, level: 3, title: Storm control limits broadcast/multicast on access ports, evidence: [config], mappings: {iso27001_2022: [A.8.20]}}
  - {id: LYSS-ACC-024, level: 3, title: Neighbor discovery (CDP/LLDP) is disabled on untrusted access ports, evidence: [config], mappings: {iso27001_2022: [A.8.20]}}
